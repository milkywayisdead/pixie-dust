<mat-toolbar>
  <button mat-icon-button
    [matTooltip]="locale.currentLocale['actions']['open']"
    (click)="dialogService.openProfileSelectDialog()">
    <mat-icon fontIcon="folder_open"></mat-icon>
  </button>
  <button mat-icon-button
    [matTooltip]="locale.currentLocale['actions']['save']"
    (click)="save()">
    <mat-icon fontIcon="save"></mat-icon>
  </button>
  <button mat-icon-button
    [matTooltip]="locale.currentLocale['actions']['addFrameGroup']"
    (click)="addFrameGroup()">
    <mat-icon fontIcon="add_box"></mat-icon>
  </button>
  <button mat-icon-button
    [matTooltip]="locale.currentLocale['locale']['language']"
    [matMenuTriggerFor]="languageMenu">
    <mat-icon fontIcon="language"></mat-icon>
  </button>
  <mat-menu #languageMenu="matMenu">
    <button mat-menu-item (click)="changeLocale('ru')">{{ locale.currentLocale['locale']['russian'] }}</button>
    <button mat-menu-item (click)="changeLocale('en')">{{ locale.currentLocale['locale']['english'] }}</button>
  </mat-menu>
</mat-toolbar>

<div>
  <div style="float:left;width:15%;margin-right:20px">
    <pix-frameslist />
  </div>

  <div style="width:50%;float:left">
    <pix-tabsarea />
  </div>
</div>
